<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인사업무봇</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

        :root {
            --primary: #2563eb;
            --primary-soft: #eff6ff;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --radius: 16px;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
            --primary-soft: #1e3a8a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: var(--bg);
            height: 100vh;
            overflow: hidden;
            display: flex;
            transition: background 0.3s;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ===== 헤더 ===== */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            transition: background 0.3s;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }

        .bot-info h1 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: var(--primary-soft);
            color: var(--primary);
        }

        /* ===== 메인 콘텐츠 ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
        }

        /* ===== 카테고리 칩 ===== */
        .chips {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            transition: background 0.3s;
        }

        .chips::-webkit-scrollbar { display: none; }

        .chip {
            padding: 5px 12px;
            background: var(--primary-soft);
            color: var(--primary);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .chip:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* ===== 채팅창 ===== */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg);
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            min-height: 0;
            padding-bottom: 100px;
        }

        .msg {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 100%;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg.bot { 
            align-self: flex-start;
            max-width: 95%;
        }
        .msg.user { 
            align-self: flex-end;
            align-items: flex-end;
            max-width: 85%;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.6;
            word-break: keep-all;
        }

        .msg.bot .bubble {
            background: var(--surface);
            color: var(--text);
            border-top-left-radius: 4px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: background 0.3s;
        }

        .msg.user .bubble {
            background: var(--primary);
            color: white;
            border-top-right-radius: 4px;
        }

        .msg-time {
            font-size: 10px;
            color: var(--muted);
            padding: 0 4px;
        }

        /* ===== 가이드 버튼 ===== */
        .guide-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .guide-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-align: left;
            font-family: inherit;
        }

        .guide-btn:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
            transform: translateX(4px);
        }

        /* ===== 추천 카드 ===== */
        .suggest-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggest-card:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .suggest-title {
            font-weight: 600;
            color: var(--text);
            font-size: 13px;
            margin-bottom: 2px;
        }

        .suggest-tag {
            font-size: 11px;
            color: var(--muted);
        }

        /* ===== 답변 카드 ===== */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-top: 6px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            transition: background 0.3s;
        }

        .card-tag {
            padding: 5px 12px;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
        }

        .card-body { padding: 14px; }

        .card-q {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 8px;
        }

        .card-a {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            flex-wrap: wrap;
            gap: 8px;
            min-height: 30px;
        }

        .feedback {
            display: flex;
            gap: 8px;
        }

        .fb-btn {
            font-size: 11px;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            border: none;
            background: none;
            font-family: inherit;
            transition: color 0.2s;
        }

        .fb-btn:hover { color: var(--primary); }

        .action-btns { display: flex; gap: 6px; }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .action-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
        .action-btn.saved { border-color: #f59e0b; color: #f59e0b; background: #fffbeb; }
        .action-btn.copied { border-color: #10b981; color: #10b981; background: #f0fdf4; }

        /* ===== 하이라이트 ===== */
        .hl { background: #fef08a; color: #713f12; border-radius: 2px; padding: 0 2px; font-weight: 700; }
        [data-theme="dark"] .hl { background: #854d0e; color: #fef08a; }

        /* ===== 자동완성 ===== */
        .autocomplete {
            position: fixed;
            bottom: 74px;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            max-height: 180px;
            overflow-y: auto;
            z-index: 200;
            display: none;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
        }

        .ac-item {
            padding: 10px 16px;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            color: var(--text);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ac-item:last-child { border-bottom: none; }
        .ac-item:hover { background: var(--primary-soft); }
        .ac-score { font-size: 10px; color: var(--muted); }

        /* ===== 입력창 ===== */
        .input-area {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            transition: background 0.3s;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 140;
            width: 100%;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 24px;
            padding: 6px 6px 6px 16px;
            transition: all 0.2s;
        }

        .input-row:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .input-row input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            color: var(--text);
            font-family: inherit;
            min-width: 0;
        }

        .input-row input::placeholder { color: var(--muted); }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover { background: #1d4ed8; transform: scale(1.05); }

        /* ===== 목록 패널 ===== */
        #list-panel, #bm-panel {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            flex-direction: column;
            gap: 12px;
            background: var(--bg);
            scrollbar-width: none;
        }

        #list-panel {
            position: fixed;
            right: 0;
            top: 56px;
            width: 100%;
            max-width: 400px;
            height: calc(100vh - 56px);
            background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: -2px 0 16px rgba(0,0,0,0.1);
            z-index: 130;
            animation: slideIn 0.3s ease;
        }

        #bm-panel {
            position: fixed;
            right: 0;
            top: 56px;
            width: 100%;
            max-width: 400px;
            height: calc(100vh - 56px);
            background: var(--surface);
            border-left: 1px solid var(--border);
            box-shadow: -2px 0 16px rgba(0,0,0,0.1);
            z-index: 130;
            animation: slideIn 0.3s ease;
            overflow-y: auto;
            padding: 16px;
            flex-direction: column;
            gap: 12px;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        #list-panel.show {
            display: flex !important;
        }

        #bm-panel.show {
            display: flex !important;
        }

        .list-group {
            margin-bottom: 16px;
        }

        .list-group-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 8px;
            padding: 8px 12px;
            background: var(--primary-soft);
            border-left: 3px solid var(--primary);
            border-radius: 6px;
        }

        .list-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
            transform: translateX(4px);
        }

        .list-item-content {
            flex: 1;
            min-width: 0;
        }

        .list-item-q {
            font-weight: 600;
            font-size: 13px;
            color: var(--text
